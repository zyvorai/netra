apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: netra-agent
  namespace: netra-system
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: netra-agent}
  template:
    metadata:
      labels: {app.kubernetes.io/name: netra-agent}
    spec:
      serviceAccountName: netra-agent
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations: [{operator: Exists}]
      containers:
      - name: agent
        image: ghcr.io/zyvorai/netra-agent:0.6.0
        securityContext: {privileged: true}
        env:
        - {name: NETRA_SERVER, value: http://netra.netra-system.svc:30870}
        - {name: NETRA_INTERFACES, value: cilium_host}
        - {name: NETRA_BPF_PIN, value: /sys/fs/bpf/netra}
        - {name: NETRA_FAILSAFE_AFTER, value: 60s}
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        - name: NETRA_AGENT_KEY
          valueFrom: {secretKeyRef: {name: netra-auth, key: agent-key, optional: true}}
        volumeMounts:
        - {name: bpffs, mountPath: /sys/fs/bpf, mountPropagation: Bidirectional}
      volumes:
      - name: bpffs
        hostPath: {path: /sys/fs/bpf, type: Directory}
