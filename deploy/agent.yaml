# Optional privileged eBPF DaemonSet. Apply only after validating node kernels (Linux 6.6+).
# The agent ServiceAccount has no Cilium-policy RBAC and token automount disabled.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: netra-agent
  namespace: netra-system
  labels:
    app.kubernetes.io/name: netra-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: netra-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netra-agent
    spec:
      serviceAccountName: netra-agent
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: netra-agent
          image: ghcr.io/zyvorai/netra-agent:0.1.0
          securityContext:
            privileged: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NETRA_SERVER
              value: http://netra.netra-system.svc:8080
            - name: NETRA_INTERFACES
              value: cilium_host
            - name: NETRA_BPF_OBJECT
              value: /opt/netra/bpf/netra_tc.o
            - name: NETRA_BPF_PIN
              value: /sys/fs/bpf/netra
          volumeMounts:
            - name: bpffs
              mountPath: /sys/fs/bpf
              mountPropagation: Bidirectional
      volumes:
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
