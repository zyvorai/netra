apiVersion: v1
kind: Service
metadata:
  name: netra
  namespace: netra-system
spec:
  selector: {app.kubernetes.io/name: netra}
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netra
  namespace: netra-system
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: netra}
  template:
    metadata:
      labels: {app.kubernetes.io/name: netra}
    spec:
      serviceAccountName: netra
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: netra
        image: ghcr.io/zyvorai/netra:0.7.0
        imagePullPolicy: IfNotPresent
        ports: [{name: http, containerPort: 8080}]
        env:
        - {name: NETRA_CILIUM_ENABLED, value: "false"}
        - {name: NETRA_HUBBLE_ENABLED, value: "false"}
        - {name: NETRA_HUBBLE_ADDR, value: hubble-relay.kube-system.svc:80}
        - {name: NETRA_AGENT_STALE_AFTER, value: 45s}
        - {name: NETRA_ALLOW_UNAUTHENTICATED, value: "false"}
        - {name: NETRA_REQUIRE_PREFLIGHT, value: "true"}
        - {name: NETRA_STATE_FILE, value: /var/lib/netra/state.json}
        - name: NETRA_API_KEY
          valueFrom: {secretKeyRef: {name: netra-auth, key: api-key, optional: false}}
        - name: NETRA_AGENT_KEY
          valueFrom: {secretKeyRef: {name: netra-auth, key: agent-key, optional: false}}
        readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 2, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /livez, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
        volumeMounts:
        - {name: state, mountPath: /var/lib/netra}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities: {drop: ["ALL"]}
      volumes:
      - name: state
        persistentVolumeClaim: {claimName: netra-state}
