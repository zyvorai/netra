# Optional: apply only when using Netra CiliumNetworkPolicy management.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: netra
rules:
- apiGroups: ["cilium.io"]
  resources: ["ciliumnetworkpolicies"]
  verbs: ["get","list","watch","create","update","patch","delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: netra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: netra
subjects:
- kind: ServiceAccount
  name: netra
  namespace: netra-system
