apiVersion: v1
kind: Namespace
metadata:
  name: netra-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: netra
  namespace: netra-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: netra-agent
  namespace: netra-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: netra-controller
rules:
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: netra-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: netra-controller
subjects:
  - kind: ServiceAccount
    name: netra
    namespace: netra-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netra
  namespace: netra-system
  labels:
    app.kubernetes.io/name: netra
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: netra
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netra
    spec:
      serviceAccountName: netra
      containers:
        - name: netrad
          image: ghcr.io/zyvorai/netra:0.1.0
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NETRA_HUBBLE_ADDR
              value: hubble-relay.kube-system.svc:80
            - name: NETRA_WEB_DIR
              value: /usr/share/netra/web
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: netra
  namespace: netra-system
spec:
  selector:
    app.kubernetes.io/name: netra
  ports:
    - port: 8080
      targetPort: http
      name: http
