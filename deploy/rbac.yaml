apiVersion: v1
kind: ServiceAccount
metadata:
  name: netra
  namespace: netra-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: netra-agent
  namespace: netra-system
automountServiceAccountToken: false
---
# Required only when NETRA_HA_ENABLED=true. Keeping it in the plain manifest
# makes switching to the documented HA Helm installation predictable.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: netra-leader-election
  namespace: netra-system
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get","create","update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: netra-leader-election
  namespace: netra-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: netra-leader-election
subjects:
- kind: ServiceAccount
  name: netra
  namespace: netra-system
