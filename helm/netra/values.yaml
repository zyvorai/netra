image:
  repository: ghcr.io/zyvorai/netra
  tag: "0.27.53"
  pullPolicy: IfNotPresent
agentImage:
  repository: ghcr.io/zyvorai/netra-agent
  tag: "0.27.53"
replicaCount: 1
ha:
  enabled: false
  leaseName: netra-controller
  leaseDuration: 15s
  renewDeadline: 10s
  retryPeriod: 2s
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
workloadConsole:
  # In-browser pod logs/exec and VM VNC. Expands controller RBAC
  # (pods/log, pods/exec, virtualmachineinstances/vnc). Default off.
  enabled: false
cilium:
  enabled: false
hubble:
  enabled: false
  address: hubble-relay.kube-system.svc:80
auth:
  allowUnauthenticated: false
  existingSecret: ""
  apiKey: ""
  agentKey: ""
policy:
  requirePreflight: true
# Optional OpenAI-compatible rewrite for /api/v1/ai/ask. Off by default.
# Heuristic briefs always work without these settings. The AI layer is
# read-only and never sees packet payloads.
ai:
  enabled: false
  baseURL: "https://api.openai.com/v1"
  model: "gpt-4o-mini"
  # Existing secret (keys: api-key) — never commit the key into values.
  existingSecret: ""
  apiKey: ""
# Optional policy-as-code / GitOps reconciliation. Off by default. Reads
# CiliumNetworkPolicy manifests from `dir` inside the netrad container —
# populate it with your own git-sync-style sidecar (not included in this
# chart) mounting the same "gitops-manifests" emptyDir this chart creates.
# autoApply=false (the default even when enabled) computes and shows plans
# only; nothing is applied without an explicit netractl policy gitops
# resync, and a high/critical-risk change is never auto-applied regardless.
gitops:
  enabled: false
  dir: /gitops/policies
  autoApply: false
  interval: 60s
# Optional Slack ChatOps slash-commands (/netra ...). Off by default. Needs
# a Slack app's signing secret to verify inbound requests reached the
# POST /chatops/slack webhook, and a dedicated API key so a compromised
# Slack app credential can't be replayed as full operator access — this is
# a separate trust domain from auth.apiKey, matching the existing
# agent-key convention. allowMutations gates which commands even register
# (e.g. "/netra mode enforce"); mutating commands always require a second
# Slack button-click confirmation regardless of this setting.
chatops:
  enabled: false
  allowMutations: false
  targetURL: "https://127.0.0.1:30870"
  # Existing secret (keys: signing-secret, api-key) — never commit these into values.
  existingSecret: ""
  signingSecret: ""
  apiKey: ""
service:
  type: ClusterIP
  port: 30870
  nodePort: null
tls:
  enabled: true
  opensslImage: alpine/openssl:3.3.2
  agentInsecureSkipVerify: true
metrics:
  enabled: true
  prometheusAnnotations: false
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 500m, memory: 256Mi}
agent:
  enabled: false
  cgroupEnabled: true
  cgroupPath: /sys/fs/cgroup
  cgroupScanInterval: 10s
  interfaces: ""
  xdpInterfaces: ""
  tcx: auto
  xdpShield: false
  pinPath: /sys/fs/bpf/netra
  failsafeAfter: 60s
  staleAfter: 45s
  # Optional /proc-derived process metadata (internal/procmeta). Off by
  # default: enabling it also enables hostPID on the agent DaemonSet, a
  # real expansion of what this already-privileged agent can see (every
  # host process's /proc, not just what eBPF hooks already surface). See
  # docs/process-metadata.md.
  procMetaEnabled: false
persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes: [ReadWriteOnce]
  size: 1Gi
  stateFile: /var/lib/netra/state.json
