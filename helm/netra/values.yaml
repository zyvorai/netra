image:
  repository: ghcr.io/zyvorai/netra
  tag: "0.14.0"
  pullPolicy: IfNotPresent
agentImage:
  repository: ghcr.io/zyvorai/netra-agent
  tag: "0.14.0"
replicaCount: 1
ha:
  enabled: false
  leaseName: netra-controller
  leaseDuration: 15s
  renewDeadline: 10s
  retryPeriod: 2s
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
cilium:
  enabled: false
hubble:
  enabled: false
  address: hubble-relay.kube-system.svc:80
auth:
  allowUnauthenticated: false
  existingSecret: ""
  apiKey: ""
  agentKey: ""
policy:
  requirePreflight: true
service:
  type: ClusterIP
  port: 30870
  nodePort: null
tls:
  enabled: true
  opensslImage: alpine/openssl:3.3.2
  agentInsecureSkipVerify: true
metrics:
  enabled: true
  prometheusAnnotations: false
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 500m, memory: 256Mi}
agent:
  enabled: false
  cgroupEnabled: true
  cgroupPath: /sys/fs/cgroup
  cgroupScanInterval: 10s
  interfaces: ""
  xdpInterfaces: ""
  pinPath: /sys/fs/bpf/netra
  failsafeAfter: 60s
  staleAfter: 45s
persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes: [ReadWriteOnce]
  size: 1Gi
  stateFile: /var/lib/netra/state.json
