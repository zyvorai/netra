{{- if and .Values.agent.enabled .Values.mtls.certManager.enabled (ne (include "netra.mtlsMode" .) "off") (not .Values.mtls.secretName) }}
# The agents' client certificate, issued and renewed by cert-manager. The issuer
# must be a CA issuer so that the Secret also carries ca.crt, which the controller
# trusts. Helm cannot check that; docs/agent-mtls.md says how to.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: netra-agent-mtls
  labels: {{- include "netra.labels" . | nindent 4 }}
spec:
  secretName: {{ include "netra.mtlsSecret" . }}
  commonName: netra-agent
  duration: {{ .Values.mtls.certManager.duration | quote }}
  renewBefore: {{ .Values.mtls.certManager.renewBefore | quote }}
  privateKey: {algorithm: ECDSA, size: 256, rotationPolicy: Always}
  usages: [client auth, digital signature]
  issuerRef:
    name: {{ required "mtls.certManager.issuerRef.name is required" .Values.mtls.certManager.issuerRef.name | quote }}
    kind: {{ .Values.mtls.certManager.issuerRef.kind | default "Issuer" }}
    group: {{ .Values.mtls.certManager.issuerRef.group | default "cert-manager.io" }}
{{- end }}
