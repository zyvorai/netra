{{- if not .Values.auth.existingSecret }}
{{- if and (not .Values.auth.allowUnauthenticated) (or (not .Values.auth.apiKey) (not .Values.auth.agentKey)) }}
{{- fail "Netra requires auth.apiKey and auth.agentKey (or auth.existingSecret). Use auth.allowUnauthenticated=true only for local development." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: netra-auth
type: Opaque
stringData:
  api-key: {{ .Values.auth.apiKey | quote }}
  agent-key: {{ .Values.auth.agentKey | quote }}
{{- end }}
