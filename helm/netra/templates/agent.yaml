{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: netra-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: netra-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netra-agent
    spec:
      serviceAccountName: netra-agent
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
      - operator: Exists
      containers:
      - name: agent
        image: "{{ .Values.agentImage.repository }}:{{ .Values.agentImage.tag }}"
        securityContext:
          privileged: true
        env:
        - name: NETRA_SERVER
          value: "{{ if .Values.tls.enabled }}https{{ else }}http{{ end }}://netra.{{ .Release.Namespace }}.svc:{{ .Values.service.port }}"
        - name: NETRA_TLS_INSECURE
          value: "{{ .Values.tls.enabled }}"
        - name: NETRA_INTERFACES
          value: {{ .Values.agent.interfaces | quote }}
        - name: NETRA_BPF_PIN
          value: {{ .Values.agent.pinPath | quote }}
        - name: NETRA_FAILSAFE_AFTER
          value: {{ .Values.agent.failsafeAfter | quote }}
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: NETRA_AGENT_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "netra.authSecretName" . }}
              key: agent-key
        volumeMounts:
        - name: bpffs
          mountPath: /sys/fs/bpf
          mountPropagation: Bidirectional
      volumes:
      - name: bpffs
        hostPath:
          path: /sys/fs/bpf
          type: Directory
{{- end }}
