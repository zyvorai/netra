{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-agent
  labels:
    app.kubernetes.io/name: netra-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: netra-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netra-agent
    spec:
      serviceAccountName: {{ .Values.agentServiceAccount.name }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: netra-agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          securityContext:
            privileged: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NETRA_SERVER
              value: "http://netra.{{ .Release.Namespace }}.svc:{{ .Values.service.port }}"
            - name: NETRA_INTERFACES
              value: {{ .Values.agent.interfaces | quote }}
            - name: NETRA_BPF_OBJECT
              value: /opt/netra/bpf/netra_tc.o
            - name: NETRA_BPF_PIN
              value: /sys/fs/bpf/netra
            - name: NETRA_FAILSAFE_AFTER
              value: {{ .Values.agent.failsafeAfter | quote }}
            - name: NETRA_AGENT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-auth
                  key: agent-key
                  optional: true
          volumeMounts:
            - name: bpffs
              mountPath: /sys/fs/bpf
              mountPropagation: Bidirectional
      volumes:
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
{{- end }}
