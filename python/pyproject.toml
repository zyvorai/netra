[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netra-langgraph"
version = "0.1.0"
description = "Optional LangGraph natural-language companion for the Netra controller"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Zyvor AI Labs" }]
dependencies = []

[project.optional-dependencies]
langgraph = [
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
]
dev = [
  "netra-langgraph[langgraph]",
]

[project.scripts]
netra-langgraph = "netra_langgraph.cli:main"

[tool.setuptools.packages.find]
include = ["netra_langgraph*"]

[tool.setuptools.package-dir]
"" = "."
