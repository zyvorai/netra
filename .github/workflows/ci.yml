name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/netrad ./cmd/netractl ./cmd/netra-agent

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web install
      - run: npm --prefix web run build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint ./helm/netra
      - run: helm template netra ./helm/netra >/dev/null
      - run: helm template netra ./helm/netra --set agent.enabled=true >/dev/null

  bpf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev linux-libc-dev
      - run: clang -O2 -g -Wall -Wextra -Werror -target bpf -c bpf/netra_tc.c -o bpf/netra_tc.o
