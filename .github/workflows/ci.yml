name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with: {go-version: '1.27.1', cache: true}
    - run: go mod tidy
    - run: go test ./...
    - name: Features catalog + CLI status unit (scripted)
      # Dedicated gate for Cilium-style features/status/banner so regressions
      # cannot hide inside a broad `go test ./...` log. Same command locally:
      # ./scripts/ci-features-unit.sh
      run: ./scripts/ci-features-unit.sh
    - name: netractl all-commands catalog (mock API)
      # Exhaustive argv→HTTP coverage for every catalogued netractl command
      # (read + representative mutates) against httptest. Same command locally:
      # ./scripts/ci-netractl-commands.sh
      # Live lab (full detail, not smoke): ./scripts/ci-netractl-remote.sh
      run: ./scripts/ci-netractl-commands.sh
    - name: P1–P5 surface unit + race (scripted)
      # Dedicated gate for the metadata surfaces (tlsfp, encdns, fleet,
      # shadow-saas, prevention, exfil/lateral/ECH, …) so regressions
      # cannot hide inside a broad `go test ./...` log. Same command
      # locally: ./scripts/ci-p1-p5-unit.sh
      run: ./scripts/ci-p1-p5-unit.sh
    - name: TLS fingerprint unit + race (scripted)
      run: ./scripts/ci-tlsfp-unit.sh
    - name: Race-detect HA leader election (no-double-ship push sinks)
      # electionLoop's promote/demote wiring is what both startSyslog and
      # startSnowflake rely on to guarantee only the active leader ever
      # ships to a collector/warehouse. -count=5 gives the concurrent
      # lease-race + mid-test handoff a few independent shots under the
      # race detector rather than relying on a single pass.
      run: go test ./cmd/netrad/... -run TestElectionLoopNeverDoubleShipsPushSinks -race -count=5
    - name: Race-detect the recent detector/sink/notify/auto-capture batch
      # These packages are new and hold mutex-protected state shared between
      # a background poller goroutine and an HTTP handler (the same shape
      # the netrad race step above exists for) — scoped here rather than
      # broadened onto the main `go test ./...` step above so a real but
      # unrelated pre-existing race elsewhere in the module can't turn this
      # batch's CI red for a reason having nothing to do with it.
      # notify/alert/webhook: multi-channel dispatcher fans events to channels
      # concurrently from poller workers. capture: auto-capture ArtifactStore
      # writes PCAPs while the poller may start sessions on the same node.
      run: go test ./internal/denysim/... ./internal/dnsdetect/... ./internal/scandetect/... ./internal/tlsfp/... ./internal/slo/... ./internal/snowflakesink/... ./internal/notify/... ./internal/alert/... ./internal/webhook/... ./internal/capture/... -race
    - name: Auto-capture unit tests (triggers, cooldown, PCAP artifact store)
      # Focused gate for the opt-in heavy-load auto-capture path so a
      # regression in ShouldTrigger / ArtifactStore prune can't hide inside
      # the broader package race batch above.
      run: go test ./internal/alert/... ./internal/capture/... -run 'ShouldTrigger|AutoCapture|ArtifactStore|ParseAutoRequestor' -count=1
    - run: go vet ./...
    - run: go build ./cmd/netrad ./cmd/netractl ./cmd/netra-agent ./cmd/netra-doctor ./cmd/netra-mcp
  web:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with: {node-version: '22', cache: npm, cache-dependency-path: web/package.json}
    - run: npm --prefix web install
    - run: npm --prefix web run typecheck
    - run: npm --prefix web test
    - run: npm --prefix web run build
  website:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with: {node-version: '22', cache: npm, cache-dependency-path: website/package-lock.json}
    - run: npm --prefix website ci
    - run: npm --prefix website run build
  helm:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: azure/setup-helm@v4
    - name: Secure default must reject missing credentials
      run: |
        if helm template insecure helm/netra >/tmp/netra-insecure.yaml 2>/tmp/netra-insecure.err; then
          echo "chart unexpectedly rendered without authentication" >&2
          exit 1
        fi
    - run: helm lint helm/netra --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key
    - run: helm template test helm/netra --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key >/tmp/netra.yaml
    - name: Default render must not grant Cilium RBAC
      run: |
        if grep -q 'cilium.io' /tmp/netra.yaml; then
          echo "standalone chart unexpectedly rendered Cilium RBAC" >&2
          exit 1
        fi
    - name: Default render must expose HTTPS 30870 with TLS and inventory RBAC
      run: |
        grep -q 'containerPort: 30870' /tmp/netra.yaml
        grep -q 'NETRA_LISTEN' /tmp/netra.yaml
        grep -q 'NETRA_TLS_CERT' /tmp/netra.yaml
        grep -q 'NETRA_TLS_KEY' /tmp/netra.yaml
        grep -q 'gen-cert' /tmp/netra.yaml
        grep -q 'scheme: HTTPS' /tmp/netra.yaml
        grep -q 'name: https' /tmp/netra.yaml
        grep -q 'resources: \["pods","services"\]' /tmp/netra.yaml
        grep -q 'kubevirt.io' /tmp/netra.yaml
        # Helm renders env as name/value pairs; Cilium must stay off by default.
        awk '/name: NETRA_CILIUM_ENABLED/{getline; if ($0 ~ /"true"/) exit 1}' /tmp/netra.yaml
        grep -q 'name: NETRA_CILIUM_ENABLED' /tmp/netra.yaml
        grep -q 'name: NETRA_HUBBLE_ENABLED' /tmp/netra.yaml
        # Opt-out path still works when explicitly disabled.
        helm template test helm/netra --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key --set tls.enabled=false >/tmp/netra-notls.yaml
        if grep -q 'NETRA_TLS_CERT' /tmp/netra-notls.yaml; then
          echo "tls.enabled=false unexpectedly rendered NETRA_TLS_CERT" >&2
          exit 1
        fi
        grep -q 'name: http' /tmp/netra-notls.yaml
        # Node agent DaemonSet is on by default (one pod per node).
        grep -q 'kind: DaemonSet' /tmp/netra.yaml
        grep -q 'name: netra-agent' /tmp/netra.yaml
        # TLS fingerprint sampler env + features RBAC for live toggles.
        grep -q 'name: NETRA_TLSFP' /tmp/netra.yaml
        awk '/name: NETRA_TLSFP$/{getline; if ($0 !~ /"auto"/) exit 1}' /tmp/netra.yaml
        grep -q 'netra-features' /tmp/netra.yaml
        grep -q 'resources: \["deployments", "daemonsets"\]' /tmp/netra.yaml
        helm template test helm/netra --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key --set agent.enabled=false >/tmp/netra-noagent.yaml
        if grep -q 'kind: DaemonSet' /tmp/netra-noagent.yaml; then
          echo "agent.enabled=false unexpectedly rendered DaemonSet" >&2
          exit 1
        fi
        helm template test helm/netra --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key --set agent.tlsfp=off >/tmp/netra-tlsfp-off.yaml
        awk '/name: NETRA_TLSFP$/{getline; if ($0 !~ /"off"/) exit 1}' /tmp/netra-tlsfp-off.yaml
    - name: Default render must not enable dns/scan detectors
      run: |
        if grep -q 'name: NETRA_DNSDETECT_ENABLED' /tmp/netra.yaml || grep -q 'name: NETRA_SCANDETECT_ENABLED' /tmp/netra.yaml; then
          echo "dnsdetect/scandetect env vars unexpectedly rendered when disabled by default" >&2
          exit 1
        fi
    - name: Default render must not enable multi-channel alerting
      run: |
        if grep -q 'name: NETRA_ALERT_CHANNELS' /tmp/netra.yaml || grep -q 'name: NETRA_ALERT_WEBHOOKS' /tmp/netra.yaml || grep -q 'name: NETRA_ALERT_POLL_INTERVAL' /tmp/netra.yaml; then
          echo "alerting env vars unexpectedly rendered when alerting.enabled=false" >&2
          exit 1
        fi
    - name: Default render must not enable auto-capture
      run: |
        if grep -q 'name: NETRA_AUTO_CAPTURE' /tmp/netra.yaml; then
          echo "auto-capture env unexpectedly rendered when alerting.autoCapture.enabled=false" >&2
          exit 1
        fi
    - run: helm template test helm/netra --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key --set agent.enabled=true >/tmp/netra-agent.yaml
    - run: helm template test helm/netra --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key --set agent.enabled=true --set cilium.enabled=true --set hubble.enabled=true >/tmp/netra-cilium.yaml
    - name: Optional Cilium render must include policy RBAC
      run: grep -q 'cilium.io' /tmp/netra-cilium.yaml
    - name: Optional Cilium render must enable Cilium and Hubble env
      run: |
        awk '/name: NETRA_CILIUM_ENABLED/{getline; if ($0 !~ /"true"/) exit 1}' /tmp/netra-cilium.yaml
        awk '/name: NETRA_HUBBLE_ENABLED/{getline; if ($0 !~ /"true"/) exit 1}' /tmp/netra-cilium.yaml
    - run: helm template test helm/netra --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key --set dnsdetect.enabled=true --set scandetect.enabled=true >/tmp/netra-detectors.yaml
    - name: Optional detector env vars render when enabled
      run: |
        grep -q 'name: NETRA_DNSDETECT_ENABLED' /tmp/netra-detectors.yaml
        grep -q 'name: NETRA_DNSDETECT_INTERVAL' /tmp/netra-detectors.yaml
        grep -q 'name: NETRA_SCANDETECT_ENABLED' /tmp/netra-detectors.yaml
        grep -q 'name: NETRA_SCANDETECT_INTERVAL' /tmp/netra-detectors.yaml
    - name: Render multi-channel alerting with channelsJson
      run: |
        cat > /tmp/alerting-values.yaml <<'EOF'
        alerting:
          enabled: true
          channelsJson: '[{"type":"webhook","name":"ci","url":"https://example.invalid/hook","minSeverity":"warning"}]'
        EOF
        helm template alert helm/netra \
          --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key \
          -f /tmp/alerting-values.yaml \
          >/tmp/netra-alerting.yaml
    - name: Alerting env vars render when enabled
      run: |
        grep -q 'name: NETRA_ALERT_POLL_INTERVAL' /tmp/netra-alerting.yaml
        grep -q 'name: NETRA_ALERT_COOLDOWN' /tmp/netra-alerting.yaml
        grep -q 'name: NETRA_ALERT_WORKERS' /tmp/netra-alerting.yaml
        grep -q 'name: NETRA_ALERT_QUEUE_SIZE' /tmp/netra-alerting.yaml
        grep -q 'name: NETRA_ALERT_CHANNELS' /tmp/netra-alerting.yaml
        grep -q 'example.invalid/hook' /tmp/netra-alerting.yaml
        if grep -q 'name: NETRA_ALERT_WEBHOOKS' /tmp/netra-alerting.yaml; then
          echo "legacy NETRA_ALERT_WEBHOOKS should not render when channelsJson is set" >&2
          exit 1
        fi
    - name: Render legacy alerting webhooksJson when channelsJson unset
      run: |
        cat > /tmp/alerting-legacy-values.yaml <<'EOF'
        alerting:
          enabled: true
          webhooksJson: '[{"name":"ci","url":"https://example.invalid/hook"}]'
        EOF
        helm template alert-legacy helm/netra \
          --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key \
          -f /tmp/alerting-legacy-values.yaml \
          >/tmp/netra-alerting-legacy.yaml
        grep -q 'name: NETRA_ALERT_WEBHOOKS' /tmp/netra-alerting-legacy.yaml
        if grep -q 'name: NETRA_ALERT_CHANNELS' /tmp/netra-alerting-legacy.yaml; then
          echo "NETRA_ALERT_CHANNELS should not render when only webhooksJson is set" >&2
          exit 1
        fi
    - name: Render alerting from existingSecret
      run: |
        helm template alert-secret helm/netra \
          --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key \
          --set alerting.enabled=true \
          --set alerting.existingSecret=netra-alerting \
          >/tmp/netra-alerting-secret.yaml
        grep -q 'name: NETRA_ALERT_CHANNELS' /tmp/netra-alerting-secret.yaml
        grep -q 'secretKeyRef' /tmp/netra-alerting-secret.yaml
        grep -q 'key: channels-json' /tmp/netra-alerting-secret.yaml
    - name: Render auto-capture when enabled
      run: |
        helm template autocap helm/netra \
          --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key \
          --set alerting.autoCapture.enabled=true \
          >/tmp/netra-autocapture.yaml
        grep -q 'name: NETRA_AUTO_CAPTURE' /tmp/netra-autocapture.yaml
        awk '/name: NETRA_AUTO_CAPTURE$/{getline; if ($0 !~ /"true"/) exit 1}' /tmp/netra-autocapture.yaml
        grep -q 'name: NETRA_AUTO_CAPTURE_DIR' /tmp/netra-autocapture.yaml
        grep -q 'name: NETRA_AUTO_CAPTURE_DURATION' /tmp/netra-autocapture.yaml
        grep -q 'name: NETRA_AUTO_CAPTURE_COOLDOWN' /tmp/netra-autocapture.yaml
        grep -q 'name: NETRA_AUTO_CAPTURE_MAX_PPS' /tmp/netra-autocapture.yaml
        grep -q 'name: NETRA_AUTO_CAPTURE_MAX_CONCURRENT' /tmp/netra-autocapture.yaml
        grep -q 'name: NETRA_AUTO_CAPTURE_MAX_ARTIFACTS' /tmp/netra-autocapture.yaml
        # With default persistence.enabled, PCAPs land under the state PVC
        # (/var/lib/netra/auto-capture). emptyDir is only used without PVC.
        helm template autocap-ed helm/netra \
          --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key \
          --set alerting.autoCapture.enabled=true \
          --set persistence.enabled=false \
          >/tmp/netra-autocapture-ed.yaml
        grep -q 'name: auto-capture' /tmp/netra-autocapture-ed.yaml
        grep -q 'mountPath: "/var/lib/netra/auto-capture"' /tmp/netra-autocapture-ed.yaml
        # Auto-capture alone (no notify channels) must still render — the
        # poller runs when NETRA_AUTO_CAPTURE=true even without webhooks.
        if grep -q 'name: NETRA_ALERT_CHANNELS' /tmp/netra-autocapture.yaml || grep -q 'name: NETRA_ALERT_WEBHOOKS' /tmp/netra-autocapture.yaml; then
          echo "auto-capture-only render unexpectedly set alert channel env" >&2
          exit 1
        fi
        # Optional AF_PACKET backend for CI / agentless capture.
        helm template autocap-be helm/netra \
          --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key \
          --set alerting.autoCapture.enabled=true \
          --set alerting.autoCapture.backend=afpacket \
          >/tmp/netra-autocapture-be.yaml
        grep -q 'name: NETRA_AUTO_CAPTURE_BACKEND' /tmp/netra-autocapture-be.yaml
        awk '/name: NETRA_AUTO_CAPTURE_BACKEND$/{getline; if ($0 !~ /afpacket/) exit 1}' /tmp/netra-autocapture-be.yaml
    - name: Standalone render must expose workload attribution safely
      run: |
        grep -q 'resources: \["pods","services"\]' /tmp/netra-agent.yaml
        grep -q '/sys/fs/cgroup' /tmp/netra-agent.yaml
        grep -q 'NETRA_CGROUP_ENABLED' /tmp/netra-agent.yaml
        grep -q 'NETRA_CGROUP_SCAN_INTERVAL' /tmp/netra-agent.yaml
        grep -q 'automountServiceAccountToken: false' /tmp/netra-agent.yaml
    - name: HA must reject a chart-managed RWO volume
      run: |
        if helm template bad-ha helm/netra \
          --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key \
          --set ha.enabled=true --set replicaCount=3 >/tmp/netra-bad-ha.yaml 2>/tmp/netra-bad-ha.err; then
          echo "chart unexpectedly allowed HA on the default RWO claim" >&2
          exit 1
        fi
    - name: Render HA with RWX storage
      run: |
        helm template ha helm/netra \
          --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key \
          --set ha.enabled=true --set replicaCount=3 \
          --set 'persistence.accessModes[0]=ReadWriteMany' >/tmp/netra-ha.yaml
        grep -q 'kind: PodDisruptionBudget' /tmp/netra-ha.yaml
        grep -q 'coordination.k8s.io' /tmp/netra-ha.yaml
        grep -q 'NETRA_HA_ENABLED' /tmp/netra-ha.yaml
        grep -q 'path: /readyz' /tmp/netra-ha.yaml
  ebpf:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: sudo apt-get update && sudo apt-get install -y clang llvm linux-libc-dev
    - uses: actions/setup-go@v5
      with: {go-version: '1.27.1', cache: true}
    - name: eBPF C helpers + compile + privileged PROG_TEST_RUN (scripted)
      # Same entrypoint locally: sudo ./scripts/ci-ebpf-tests.sh
      # Covers bpf/tests/*.c, clang of netra_tc/edge/capture/tlsfp, and
      # bpf/integration (including TestTLSFP*).
      run: sudo -E env "PATH=$PATH" "HOME=$HOME" "GOPATH=${GOPATH:-$HOME/go}" "GOMODCACHE=${GOMODCACHE:-}" "GOCACHE=${GOCACHE:-}" ./scripts/ci-ebpf-tests.sh
  auto-capture-veth:
    # Privileged Linux smoke for opt-in auto-capture: veth + iperf3 TCP +
    # AF_PACKET feeder → non-empty PCAP under NETRA_AUTO_CAPTURE_DIR.
    # Softnet trigger is synthetic (≥1000) so CI does not depend on flaky
    # real softnet counters under GitHub-hosted load.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with: {go-version: '1.27.1', cache: true}
    - name: Install iperf3
      run: sudo apt-get update && sudo apt-get install -y iperf3 iproute2
    - name: Auto-capture veth + iperf3 smoke
      run: sudo -E env "PATH=$PATH" "HOME=$HOME" "GOPATH=${GOPATH:-$HOME/go}" "GOMODCACHE=${GOMODCACHE:-}" "GOCACHE=${GOCACHE:-}" ./scripts/ci-auto-capture-veth.sh
  tlsfp-smoke:
    # Privileged Linux smoke for always-on JA3/JA4: compile netra_tlsfp.o,
    # BPF_PROG_TEST_RUN sampler tests, then live agent + openssl ClientHello
    # (+ iperf3 TCP background) → uniqueJa3 > 0 on the controller API.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with: {go-version: '1.27.1', cache: true}
    - name: Install clang, iperf3, openssl
      run: sudo apt-get update && sudo apt-get install -y clang llvm linux-libc-dev iperf3 iproute2 openssl
    - name: TLS fingerprint openssl + iperf3 smoke
      run: sudo -E env "PATH=$PATH" "HOME=$HOME" "GOPATH=${GOPATH:-$HOME/go}" "GOMODCACHE=${GOMODCACHE:-}" "GOCACHE=${GOCACHE:-}" ./scripts/ci-tlsfp-smoke.sh
